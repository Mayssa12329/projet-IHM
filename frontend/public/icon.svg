<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .gradient-primary { stop-color: #3b82f6; }
      .gradient-secondary { stop-color: #1e40af; }
      .gradient-accent { stop-color: #8b5cf6; }
      .gradient-accent-dark { stop-color: #6d28d9; }
      .text-color { fill: #1f2937; }
      .bubble-color { fill: #3b82f6; }
    }
    @media (prefers-color-scheme: dark) {
      .gradient-primary { stop-color: #60a5fa; }
      .gradient-secondary { stop-color: #3b82f6; }
      .gradient-accent { stop-color: #a78bfa; }
      .gradient-accent-dark { stop-color: #8b5cf6; }
      .text-color { fill: #f3f4f6; }
      .bubble-color { fill: #60a5fa; }
    }
  </style>
  
  <defs>
    <linearGradient id="gradientBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="gradient-primary"/>
      <stop offset="100%" class="gradient-secondary"/>
    </linearGradient>
    <linearGradient id="gradientPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="gradient-accent"/>
      <stop offset="100%" class="gradient-accent-dark"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="transparent"/>
  
  <!-- Outer subtle circle -->
  <circle cx="96" cy="96" r="92" fill="url(#gradientBlue)" opacity="0.08"/>
  
  <!-- Left person (head) -->
  <circle cx="50" cy="48" r="14" fill="url(#gradientBlue)" filter="url(#shadow)"/>
  
  <!-- Right person (head) -->
  <circle cx="142" cy="48" r="14" fill="url(#gradientPurple)" filter="url(#shadow)"/>
  
  <!-- Center person (head) -->
  <circle cx="96" cy="62" r="16" fill="url(#gradientBlue)" filter="url(#shadow)"/>
  
  <!-- Left person body -->
  <rect x="44" y="66" width="12" height="24" rx="2" fill="url(#gradientBlue)" filter="url(#shadow)"/>
  
  <!-- Right person body -->
  <rect x="136" y="66" width="12" height="24" rx="2" fill="url(#gradientPurple)" filter="url(#shadow)"/>
  
  <!-- Center person body -->
  <rect x="90" y="82" width="12" height="28" rx="2" fill="url(#gradientBlue)" filter="url(#shadow)"/>
  
  <!-- Connection lines -->
  <g stroke="url(#gradientPurple)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M 58 62 Q 75 78 88 88"/>
    <path d="M 134 62 Q 117 78 104 88"/>
  </g>
  
  <!-- Bottom section - Communication element -->
  <g filter="url(#shadow)">
    <!-- Left speech bubble -->
    <rect x="24" y="120" width="50" height="36" rx="8" fill="url(#gradientBlue)" opacity="0.85"/>
    <polygon points="28,156 18,168 32,156" fill="url(#gradientBlue)" opacity="0.85"/>
    
    <!-- Right speech bubble -->
    <rect x="118" y="128" width="50" height="34" rx="8" fill="url(#gradientPurple)" opacity="0.85"/>
    <polygon points="152,162 162,172 148,162" fill="url(#gradientPurple)" opacity="0.85"/>
  </g>
  
  <!-- Text indicators inside bubbles -->
  <g fill="white" opacity="0.7">
    <circle cx="32" cy="130" r="2.5"/>
    <circle cx="45" cy="130" r="2.5"/>
    <circle cx="58" cy="130" r="2.5"/>
    <circle cx="126" cy="140" r="2.5"/>
    <circle cx="139" cy="140" r="2.5"/>
    <circle cx="152" cy="140" r="2.5"/>
  </g>
  
  <!-- Connecting line between bubbles -->
  <path d="M 74 138 L 118 142" stroke="url(#gradientBlue)" stroke-width="1" fill="none" stroke-dasharray="2,3" opacity="0.4"/>
  
  <!-- Small accent dot in center top -->
  <circle cx="96" cy="25" r="3" fill="url(#gradientPurple)" opacity="0.5"/>
</svg>